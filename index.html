
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Divine Krishna - Radhe Radhe</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>॥ श्री कृष्ण ॥</h1>

        <p class="subtitle">
            The Divine Flute Player
        </p>

        <div class="art-container">

            <svg id="krishnaArt"
                 viewBox="0 0 600 700"
                 xmlns="http://www.w3.org/2000/svg">

                <defs>
                    <linearGradient id="gold">
                        <stop offset="0%" stop-color="#fff4bd"/>
                        <stop offset="50%" stop-color="#ffc34d"/>
                        <stop offset="100%" stop-color="#fff0a0"/>
                    </linearGradient>

                    <linearGradient id="blue">
                        <stop offset="0%" stop-color="#72d9ff"/>
                        <stop offset="100%" stop-color="#2476d8"/>
                    </linearGradient>
                </defs>

                <!-- Peacock feather -->
                <path class="draw gold"
                      d="M330 165 Q365 95 415 65
                         Q445 125 405 170"/>

                <path class="draw blue"
                      d="M415 65 Q390 105 405 145"/>

                <ellipse class="draw gold"
                         cx="410" cy="112"
                         rx="13" ry="24"/>

                <!-- Crown -->
                <path class="draw gold"
                      d="M220 215 Q220 155 280 145
                         Q340 130 390 175
                         L420 220"/>

                <path class="draw gold"
                      d="M230 190 Q300 165 390 190"/>

                <!-- Hair -->
                <path class="draw gold"
                      d="M225 210 Q170 230 185 310
                         Q180 390 225 425"/>

                <path class="draw gold"
                      d="M390 205 Q445 255 420 340
                         Q415 390 380 420"/>

                <!-- Face -->
                <path class="draw gold"
                      d="M225 220
                         Q230 195 300 195
                         Q375 195 390 230
                         Q410 290 380 355
                         Q350 420 300 430
                         Q250 420 225 355
                         Q195 290 225 220 Z"/>

                <!-- Eyes -->
                <path class="draw gold"
                      d="M235 285 Q260 265 285 285
                         Q260 305 235 285"/>

                <path class="draw gold"
                      d="M315 285 Q340 265 365 285
                         Q340 305 315 285"/>

                <!-- Nose -->
                <path class="draw gold"
                      d="M300 285 L290 335 L305 342"/>

                <!-- Smile -->
                <path class="draw gold"
                      d="M270 365 Q300 385 330 365"/>

                <!-- Neck -->
                <path class="draw gold"
                      d="M270 420 L270 465
                         Q300 490 330 465 L330 420"/>

                <!-- Shoulders and body -->
                <path class="draw blue"
                      d="M270 465
                         Q210 470 165 520
                         L130 650
                         M330 465
                         Q390 470 435 520
                         L470 650"/>

                <!-- Flute -->
                <path class="draw gold"
                      d="M115 370 Q300 350 490 375"/>

                <path class="draw gold"
                      d="M115 360 L115 380
                         M490 365 L490 385"/>

                <!-- Flute holes -->
                <circle class="draw gold" cx="200" cy="365" r="5"/>
                <circle class="draw gold" cx="250" cy="360" r="5"/>
                <circle class="draw gold" cx="350" cy="360" r="5"/>
                <circle class="draw gold" cx="400" cy="365" r="5"/>

            </svg>

        </div>

        <button id="startBtn">
            ✨ Begin Divine Art
        </button>

        <p class="footer">Radhe Radhe ❤️</p>

    </div>

    <script src="script.js"></script>

</body>
</html>
